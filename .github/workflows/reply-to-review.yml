name: Reply to review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [review_requested]

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request != null && 
       github.event.sender.id == 8929706 && 
       contains(github.event.comment.body, '@akubiusa') && 
       contains(github.event.comment.body, 'review')) ||
      (github.event_name == 'pull_request' && 
       github.event.action == 'review_requested' && 
       github.event.requested_reviewer.id == 222856114)

    steps:
      - name: Review
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER=${{ github.event.issue.number }}
            MESSAGE="It was reviewed by a request by comment."
          else
            PR_NUMBER=${{ github.event.pull_request.number }}
            MESSAGE="It was reviewed by a reviewer assignment."
          fi
          gh pr review $PR_NUMBER -R "$GITHUB_REPOSITORY" -a -b "$MESSAGE"
        env:
          GITHUB_TOKEN: ${{ secrets.AKUBIUSA_ACCESS_TOKEN }}
